name: Kyber telemetry tests and browser checks

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[server,test]"

    - name: Run Pytest Suite
      run: |
        python -m pytest -v
        python -m compileall -q agents kyber_pqc_kem cli.py enrichment.py simulator.py
        python -m pip check
        kyber-pqc-kem-engine --help
        node tests/web-smoke.cjs

    - name: Smoke-check in-memory audit-chain integrity
      run: |
        python -c "
        from agents.base import PHIGuard, AuditLogger
        import pytest
        assert AuditLogger.verify_integrity() is True
        print('Audit-chain smoke check passed')
        "
